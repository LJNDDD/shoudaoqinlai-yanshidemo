<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>手到擒来 · 医疗软件产品中心</title>

    <!-- Font Awesome 6 (图标库) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- 主样式表 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">

    <!-- ========== 头部品牌区 ========== -->
    <div class="hero">
        <div class="brand">
            <h1>
                <img src="logo.png?v=2" alt="手到擒来" class="brand-logo">
                手到擒来 · 智汇平台
            </h1>
            <div class="tagline">
                全院级医疗软件中枢 · 唯一产品展示入口
            </div>
        </div>
        <div class="hero-actions">
            <a href="/data-management.html" class="btn-nav" title="数据管理">
                <i class="fas fa-database"></i>
            </a>
            <button class="btn-settings" id="btnSettings" title="设置">
                <i class="fas fa-cog"></i>
            </button>
        </div>
    </div>

    <!-- ========== 产品卡片网格 ========== -->
    <div class="filter-bar">
        <div class="filter-segment" id="filterSegment">
            <button class="filter-btn active" data-category="all">首页</button>
            <button class="filter-btn" data-category="1">智慧体检产品</button>
            <button class="filter-btn" data-category="2">健康指数产品</button>
            <button class="filter-btn" data-category="3">健康管理产品</button>
            <button class="filter-btn" data-category="4">检验报告分析</button>
            <div class="filter-indicator"></div>
        </div>
    </div>
    <div id="productsContainer" class="products-grid">
        <!-- 由 js/main.js 动态渲染 -->
    </div>

    <!-- ========== 页脚 / 公司信息 ========== -->
    <div class="footer">
        <div class="footer-brand">上海手到擒来信息科技有限公司</div>
        <div class="footer-meta">
            <span><i class="fas fa-map-marker-alt"></i>公司总部：上海市虹口区四川北路1689号合新里3楼305单元</span>
            <span><i class="fas fa-envelope"></i>联系邮箱：<a href="mailto:infor@effortlessai.cn">infor@effortlessai.cn</a></span>
        </div>
    </div>
</div>

<!-- 产品数据 -->
<script src="js/products.js"></script>
<!-- 主渲染逻辑 -->
<script src="js/main.js"></script>

</body>
</html>
