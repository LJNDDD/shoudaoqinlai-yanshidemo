<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>手到擒来 · 医疗软件产品中心</title>

    <!-- Font Awesome 6 (图标库) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- 主样式表 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">

    <!-- ========== 头部品牌区 ========== -->
    <div class="hero">
        <div class="brand">
            <h1>
                <img src="logo.png?v=2" alt="手到擒来" class="brand-logo">
                手到擒来 · 智汇平台
            </h1>
            <div class="tagline">
                全院级医疗软件中枢 · 唯一产品展示入口
            </div>
        </div>
    </div>

    <!-- ========== 产品卡片网格 ========== -->
    <div class="filter-bar">
        <div class="filter-segment" id="filterSegment">
            <button class="filter-btn active" data-category="all">全部产品</button>
            <button class="filter-btn" data-category="智慧体检产品">智慧体检产品</button>
            <button class="filter-btn" data-category="社区健康管理产品">社区健康管理产品</button>
            <button class="filter-btn" data-category="检验报告分析">检验报告分析</button>
            <div class="filter-indicator"></div>
        </div>
    </div>
    <div id="productsContainer" class="products-grid">
        <!-- 由 js/main.js 动态渲染 -->
    </div>

    <!-- ========== 页脚 / 公司简介 ========== -->
    <div class="footer">
        <p>上海手到擒来信息科技2026年注册于上海嘉定，以动态医学知识库、医学知识图谱为核心底座，专注医疗AI落地应用。</p>
        <p>依托大模型、Agent、RAG全栈技术，自研智能主检、智能复诊、全科智能体、体检解析引擎系列产品，落地中帮助医护工作效率提升约50%，合作机构健康管理营收增收15%~20%；严控AI生成幻觉，采用产品销售+技术授权双模式赋能医院降本增效。</p>
        <p>公司摒弃Demo型产品、注重长效落地服务，诚邀技术人才与行业伙伴共建智慧医疗生态。</p>
    </div>
</div>

<!-- 产品数据 -->
<script src="js/products.js"></script>
<!-- 主渲染逻辑 -->
<script src="js/main.js"></script>

</body>
</html>
