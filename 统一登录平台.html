<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>手到擒来 · 医疗软件产品中心</title>
    <!-- 引入 Font Awesome 6 (免费图标库) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- 谷歌字体: Poppins 现代几何体 -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(160deg, #F7F9FC 0%, #EDF2F9 100%);
            color: #1B2A3A;
            line-height: 1.4;
            scroll-behavior: smooth;
        }

        /* 主容器 */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
        }

        /* 头部区域 */
        .hero {
            margin-bottom: 1.2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-end;
            gap: 1.5rem;
            border-bottom: 1.5px solid rgba(22, 97, 171, 0.18);
            padding-bottom: 1.5rem;
        }
        .brand {
            flex: 1;
        }
        .brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1661AB, #0F4A85);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .brand h1 i {
            background: none;
            color: #1661AB;
            font-size: 1.5rem;
            background-clip: unset;
            -webkit-background-clip: unset;
        }
        .brand .tagline {
            color: #5B7A9A;
            font-size: 0.95rem;
            margin-top: 0.5rem;
            font-weight: 400;
            border-left: 3px solid #1661AB;
            padding-left: 0.75rem;
        }
        /* 卡片网格 */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.2rem;
            transition: 0.2s;
        }
        /* 矩形卡片样式 */
        .product-card {
            background: #fff;
            border-radius: 1.2rem;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            box-shadow: 0 2px 12px -2px rgba(22, 97, 171, 0.06);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(22, 97, 171, 0.08);
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 24px -6px rgba(22, 97, 171, 0.12);
            border-color: rgba(22, 97, 171, 0.25);
        }
        .card-header {
            padding: 1rem 1rem 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #F0F4FA;
        }
        .card-icon {
            background: linear-gradient(135deg, #EEF2F8, #E2E9F2);
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 1.3rem;
            transition: 0.2s;
        }
        .product-card:hover .card-icon {
            background: linear-gradient(135deg, #E2E9F2, #D6DFEC);
            transform: scale(0.96);
        }
        .product-name {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.2px;
            color: #1B2A3A;
            line-height: 1.3;
        }
        .card-body {
            padding: 0.6rem 1rem 0.5rem 1rem;
            flex: 1;
        }
        .description {
            color: #5A7088;
            font-size: 0.72rem;
            line-height: 1.4;
            margin-bottom: 0.6rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2rem;
        }
        .audience-section {
            margin: 0.4rem 0 0.3rem;
        }
        .platform-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 0.15rem 0.55rem;
            border-radius: 40px;
            font-size: 0.55rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 0.35rem;
        }
        .platform-mobile {
            background: #EBF7EE;
            color: #3AAA35;
        }
        .platform-web {
            background: #E3ECF6;
            color: #1661AB;
        }
        .audience-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            color: #8BA5C0;
            margin-bottom: 0.35rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .audience-tags {
            display: flex;
            flex-wrap: nowrap;
            gap: 0.35rem;
            overflow: hidden;
        }
        .tag {
            background: #EDF2F8;
            padding: 0.2rem 0.55rem;
            border-radius: 40px;
            font-size: 0.6rem;
            font-weight: 500;
            color: #1661AB;
            transition: 0.1s;
            letter-spacing: 0.2px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .tag i {
            font-size: 0.55rem;
            color: #4A8DCE;
        }
        .card-footer {
            padding: 0.3rem 1rem 0.8rem 1rem;
            margin-top: auto;
        }
        .btn-detail {
            background: transparent;
            border: 1px solid #CDDEEE;
            width: 100%;
            padding: 0.5rem 0;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            color: #1661AB;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-detail i {
            font-size: 0.65rem;
            transition: transform 0.2s;
        }
        .btn-detail:hover {
            background: #1661AB;
            border-color: #1661AB;
            color: white;
            box-shadow: 0 4px 12px rgba(22, 97, 171, 0.3);
        }
        .btn-detail:hover i {
            transform: translateX(3px);
            color: white;
        }
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 3.5rem 2rem;
            background: rgba(255,255,255,0.7);
            border-radius: 2rem;
            margin-top: 1rem;
            color: #8BA5C0;
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.6;
            color: #1661AB;
        }
        /* 页脚 */
        .footer {
            margin-top: 4rem;
            text-align: center;
            font-size: 0.8rem;
            color: #8BA5C0;
            border-top: 1px solid rgba(22, 97, 171, 0.12);
            padding-top: 2rem;
        }
        @media (max-width: 1200px) {
            .products-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 1rem;
            }
        }
        @media (max-width: 860px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.8rem;
            }
        }
        @media (max-width: 540px) {
            .app-container {
                padding: 1.2rem 1rem 2rem;
            }
            .hero {
                flex-direction: column;
                align-items: stretch;
            }
            .brand h1 {
                font-size: 1.6rem;
            }
            .products-grid {
                gap: 0.8rem;
                grid-template-columns: 1fr;
            }
            .card-header {
                padding: 1rem 1rem 0.5rem;
            }
            .card-body {
                padding: 0.6rem 1rem 0.5rem;
            }
            .card-footer {
                padding: 0.5rem 1rem 1rem;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- 头部品牌区 -->
    <div class="hero">
        <div class="brand">
            <h1>
                <i class="fas fa-microscope"></i> 
                手到擒来 · 智汇平台
            </h1>
            <div class="tagline">
                全院级医疗软件中枢 · 唯一产品展示入口
            </div>
        </div>
    </div>

    <!-- 产品卡片容器 -->
    <div id="productsContainer" class="products-grid">
        <!-- 动态渲染js -->
    </div>
    <div class="footer">
        <i class="fas fa-shield-alt"></i> 手到擒来科技 · 智慧医疗解决方案 | 产品持续更新，致力于临床数字化革新
    </div>
</div>

<script>
    // ---------- 产品数据（医疗软件公司产品库）-----------
    const productsData = [
        {
            id: 1,
            name: "健康指数-卫健委版本",
            description: "体检就诊后患者健康管理平台，提供健康指数追踪、指标趋势分析、异常预警及个性化健康建议，帮助医疗机构有效留存患者，实现诊后持续关怀与复诊引导。",
            targetUsers: "患者, 医生",
            iconClass: "fas fa-file-alt",
            iconColor: "#1661AB",
            link: "http://health-index-wjw.showcase.effortlessai.cn/",
            platform: "移动端"
        },
        {
            id: 2,
            name: "PACS Vision 影像存档与通信系统",
            description: "支持DICOM无损传输、三维重建及AI辅助诊断，提供跨院区影像调阅与远程会诊，高效赋能放射及临床科室。",
            targetUsers: "放射科医生, 影像技师, 临床医生",
            iconClass: "fas fa-x-ray",
            iconColor: "#00897B",
            link: "",
            platform: "Web端"
        },
        {
            id: 3,
            name: "HIS Cloud 医院信息管理系统",
            description: "一体化云端HIS，涵盖门诊挂号、收费、药库、住院登记、医保结算等核心业务，智能报表助力医院精细化管理。",
            targetUsers: "医院管理员, 财务人员, 门诊护士, 收费员",
            iconClass: "fas fa-hospital-user",
            iconColor: "#5B8C5A",
            link: "",
            platform: "Web端"
        },
        {
            id: 4,
            name: "LabLink 检验信息系统 (LIS)",
            description: "全流程检验数据自动化采集，质控规则引擎，危机值预警，多院区检验结果互认，提升实验室工作效率与准确性。",
            targetUsers: "检验科医生, 实验室技术员, 护士",
            iconClass: "fas fa-flask",
            iconColor: "#E67E22",
            link: "",
            platform: "Web端"
        },
        {
            id: 5,
            name: "TeleMed 远程医疗平台",
            description: "高清实时视频问诊、电子处方流转、远程随访及多学科会诊(MDT)模块，打通基层与三甲医疗资源，赋能分级诊疗。",
            targetUsers: "医生, 患者, 远程协调员, 社区医师",
            iconClass: "fas fa-video",
            iconColor: "#6B5B95",
            link: "",
            platform: "移动端"
        },
        {
            id: 6,
            name: "SmartWard 智慧病房系统",
            description: "物联网+床旁智能交互，生命体征实时监测、智能输液预警、护士站看板与患者宣教，打造安全高效的数字病房。",
            targetUsers: "护士, 医生, 患者家属, 医院管理者",
            iconClass: "fas fa-bed",
            iconColor: "#C0392B",
            link: "",
            platform: "移动端"
        },
        {
            id: 7,
            name: "PharmCare 临床药学管理系统",
            description: "合理用药监测、处方点评、抗菌药物分级管理及药学知识库，降低用药风险，提升药学服务质量。",
            targetUsers: "药师, 临床医生, 质控科",
            iconClass: "fas fa-capsules",
            iconColor: "#2980B9",
            link: "",
            platform: "Web端"
        },
        {
            id: 8,
            name: "OR Navigator 手术智慧调度平台",
            description: "手术排程、器械追溯、术中信息一体化及麻醉记录电子化，优化手术室利用率，保障围术期安全。",
            targetUsers: "外科医生, 麻醉师, 手术室护士, 运营主管",
            iconClass: "fas fa-procedures",
            iconColor: "#8E6E53",
            link: "",
            platform: "Web端"
        }
    ];

    // 全局变量
    const container = document.getElementById("productsContainer");

    // 辅助函数：渲染卡片
    function renderProducts() {
        let filtered = productsData;

        // 空状态处理
        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="empty-state" style="grid-column:1/-1;">
                    <i class="fas fa-search-minus"></i>
                    <h3 style="margin: 0.5rem 0; font-weight:500;">未找到相关产品</h3>
                    <p style="font-size:0.85rem;">试试其他关键词，或清除筛选条件</p>
                </div>
            `;
            return;
        }

        // 动态生成卡片HTML
        let cardsHTML = "";
        for (let product of filtered) {
            // 处理使用人群标签：分割字符串，生成标签数组
            let audienceList = product.targetUsers.split(",").map(item => item.trim());
            // 构建人群标签html
            let tagsHtml = "";
            audienceList.slice(0, 3).forEach(audience => {
                // 为不同人群添加小图标（可爱点缀）
                let icon = "fa-user-md";
                if (audience.includes("医生")) icon = "fa-user-md";
                else if (audience.includes("护士")) icon = "fa-user-nurse";
                else if (audience.includes("技师") || audience.includes("技术员")) icon = "fa-microscope";
                else if (audience.includes("患者")) icon = "fa-user-injured";
                else if (audience.includes("管理员") || audience.includes("管理者")) icon = "fa-chalkboard-user";
                else if (audience.includes("药师")) icon = "fa-prescription-bottle";
                else if (audience.includes("财务")) icon = "fa-chart-line";
                else if (audience.includes("家属")) icon = "fa-heartbeat";
                else icon = "fa-users";
                tagsHtml += `<span class="tag"><i class="fas ${icon}"></i> ${audience}</span>`;
            });

            // 构建单个卡片
            cardsHTML += `
                <div class="product-card" data-id="${product.id}">
                    <div class="card-header">
                        <div class="card-icon" style="color:${product.iconColor}">
                            <i class="${product.iconClass}"></i>
                        </div>
                        <div class="product-name">${escapeHtml(product.name)}</div>
                    </div>
                    <div class="card-body">
                        <div class="description">${escapeHtml(product.description)}</div>
                        <div class="platform-tag ${product.platform === '移动端' ? 'platform-mobile' : 'platform-web'}">
                            <i class="fas ${product.platform === '移动端' ? 'fa-mobile-alt' : 'fa-desktop'}"></i> ${product.platform || 'Web端'}
                        </div>
                        <div class="audience-section">
                            <div class="audience-label">
                                <i class="fas fa-users-viewfinder"></i> 适用人群
                            </div>
                            <div class="audience-tags">
                                ${tagsHtml}
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="btn-detail detail-btn" data-pname="${escapeHtml(product.name)}" data-pid="${product.id}" data-link="${escapeHtml(product.link || '')}">
                            <span>点击演示</span> <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            `;
        }
        container.innerHTML = cardsHTML;

        // 绑定所有详情按钮的点击事件（事件委托也可以，但直接在渲染后绑定简便稳妥）
        document.querySelectorAll('.detail-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const productName = btn.getAttribute('data-pname') || "此产品";
                const link = btn.getAttribute('data-link') || "";
                if (link) {
                    window.open(link, '_blank');
                } else {
                    alert(`✨ 【${productName}】\n手到擒来科技致力于提供先进的医疗信息化解决方案。\n如需完整产品资料、演示或报价，请联系销售代表。\n（演示交互 — 产品统一入口展示）`);
                }
            });
        });
    }

    // 简单的防XSS辅助函数
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // 初始渲染
    renderProducts();

    // 可选：增加轻量级入口描述，卡片hover时增加提升，已在样式中完成
    // 额外优雅特性：动态展示平台唯一入口特性，控制台友好
    console.log("手到擒来产品中心已启动 | 唯一产品展示入口 | 卡片集成名称、简介、使用人群三要素");
</script>
</body>
</html>
